[accessibility]
ui_scale = 1.2

[bar.default]
center = [ "workspaces", "spacer_1", "active_window" ]
concave_edge_corners = true
end = [
    "media",
    "spacer_1",
    "airpods",
    "tray",
    "indicator",
    "ambient-sounds",
    "spacer_1",
    "bar",
    "network_rx",
    "network_tx",
    "spacer_1",
    "volume",
    "session",
    "notifications"
]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.1000000000000001
start = [ "launcher", "clock", "spacer_1", "group:g1" ]
thickness = 35

    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 1.0
    padding = 6.0

[battery.device."/org/freedesktop/UPower/devices/mouse_hidpp_battery_0"]
warning_threshold = 20

[brightness]
enable_ddcutil = true

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    locked_timeout = 30.0
    timeout = 660.0

[location]
address = "Telega"
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1536.0
    cy = 1509.60009765625
    output = "DP-2"
    placement_height = 1728.0
    placement_width = 3072.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."fel/agent-glow"]
status_open_near_click = true
status_position = "auto"

[plugin_settings."felipeartur/ai-usagebar"]
panel_placement = "floating"

[plugins]
enabled = [ "harveywuk/airpods", "felipeartur/ai-usagebar", "reaperhound/ambient-sounds" ]

[shell]
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
corner_radius_scale = 0.2500000037252903
launch_apps_as_systemd_services = true
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
builtin = "Gruvbox"
community_palette = "Oxide"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "ghostty", "kcolorscheme", "kitty", "qt", "starship" ]

[wallpaper.default]
path = "/home/cristianbilu/Pictures/1277674.jpg"

[wallpaper.last]
path = "/home/cristianbilu/Pictures/1277674.jpg"

[wallpaper.monitors.DP-2]
path = "/home/cristianbilu/Pictures/1277674.jpg"

[[wallpaper.favorite]]
builtin_palette = "Gruvbox"
palette_source = "builtin"
path = "/home/cristianbilu/Pictures/1277674.jpg"
theme_mode = "dark"

[widget.active_window]
enabled = false

[widget.airpods]
type = "harveywuk/airpods:airpods"

[widget.ambient-sounds]
type = "reaperhound/ambient-sounds:ambient-sounds"

[widget.bar]
type = "felipeartur/ai-usagebar:bar"

[widget.clock]
color = "secondary"
format = "{:%H:%M %A %m/%d/%y}"

[widget.indicator]
type = "fel/agent-glow:indicator"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.network_rx]
custom_label = "D"
network_speed_compact = true
show_glyph = false

[widget.network_tx]
custom_label = "U"
network_speed_compact = true
show_glyph = false

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
length = 15
type = "spacer"

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.temp]
show_value = false

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 1.5
anchor = true
capsule = true
capsule_fill = "on_primary"
hide_when_empty = true
inactive_pill_size = 1.0
pill_scale = 0.80000000000000004
show_labels = false
